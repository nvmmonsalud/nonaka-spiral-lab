name: Feature Request
description: Suggest an idea for the Knowledge Spiral Lab
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should the feature look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What have you considered as alternatives?
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of the project does this affect?
      options:
        - Simulator Canvas
        - UI / Design
        - Research / Paper
        - Documentation
        - Infrastructure / CI
        - Other
    validations:
      required: true
